# ============================================================================
# Grafana Datasources Configuration - AI Security Lab v4.0
# ============================================================================

apiVersion: 1

datasources:
  # Prometheus for metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "300s"
      httpMethod: "POST"

  # TimescaleDB for events and analytics
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: security_events
    user: security
    secureJsonData:
      password: "${POSTGRES_PASSWORD}"
    jsonData:
      sslmode: "disable"
      maxOpenConns: 100
      maxIdleConns: 100
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: true

  # Loki for logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      httpHeaderName1: "X-Scope-OrgID"
    secureJsonData:
      httpHeaderValue1: "tenant1"

  # Tempo for traces
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: "GET"
      tracesToLogs:
        datasourceUid: "loki"
        tags: ["service.name", "service.namespace"]
        mappedTags: [{"key": "service.name", "value": "service"}]
        mapTagNamesEnabled: false
        spanStartTimeShift: "1h"
        spanEndTimeShift: "1h"
        filterByTraceID: false
        filterBySpanID: false

  # Qdrant for vector similarity
  - name: Qdrant
    type: qdrant-datasource
    access: proxy
    url: http://qdrant:6333
    editable: true
    jsonData:
      apiKey: ""

  # MinIO for object storage metrics
  - name: MinIO
    type: marcusolsson-json-datasource
    access: proxy
    url: http://minio:9000/minio/v2/metrics/cluster
    editable: true
